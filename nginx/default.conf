server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Docker's embedded DNS. Upstreams are resolved per request (see the
    # variable proxy_passes below) so nginx starts even when the content
    # receiver or Matomo is restarting, and picks up a new container IP
    # without a portfolio restart.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Uploaded article payloads carry base64 images; the receiver enforces its
    # own limits, nginx must not reject them earlier.
    client_max_body_size 32m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Baseline security headers. They are repeated inside each location on
    # purpose: nginx does not inherit server-level add_header into a location
    # that declares any add_header of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Blog & article pages: pre-rendered by the content receiver ─────────
    # Files live in a Docker volume mounted read-only at /srv/content.
    location /blog/ {
        root /srv/content/public;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Article media: content-addressed file names, safe to cache forever.
    location /media/ {
        root /srv/content/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Feed consumed by the React blog section.
    location = /content/blog-index.json {
        root /srv/content/public;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sitemap is regenerated by the receiver on every publish/unpublish.
    location = /sitemap.xml {
        root /srv/content/public;
        default_type application/xml;
        add_header Cache-Control "public, max-age=1800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Authenticated WordPress -> static publisher channel ───────────────
    location /content-api/ {
        # `set` must run before `rewrite ... break`: break ends the rewrite
        # phase, and a later set would leave the upstream variable empty.
        set $content_receiver http://content-receiver:8080;
        rewrite ^/content-api/(.*)$ /$1 break;
        proxy_pass $content_receiver;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Matomo: public tracking endpoints only ────────────────────────────
    # The administration interface is intentionally NOT reachable from the
    # internet; it is used through an SSH tunnel.
    location = /matomo/matomo.php {
        set $matomo_upstream http://matomo:80;
        proxy_pass $matomo_upstream/matomo/matomo.php$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /matomo/matomo.js {
        set $matomo_upstream http://matomo:80;
        proxy_pass $matomo_upstream/matomo/matomo.js$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Backwards-compatible tracker aliases used by some Matomo snippets.
    location = /matomo/piwik.php {
        set $matomo_upstream http://matomo:80;
        proxy_pass $matomo_upstream/matomo/matomo.php$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        add_header Cache-Control "no-store" always;
    }

    location = /matomo/piwik.js {
        set $matomo_upstream http://matomo:80;
        proxy_pass $matomo_upstream/matomo/matomo.js$is_args$args;
        proxy_set_header Host $host;
        expires 1h;
    }

    # Reporting API for the WordPress dashboard: POST only, API module only.
    # token_auth travels in the POST body, never in the URL or an access log.
    location = /matomo/index.php {
        if ($request_method != POST) { return 404; }
        if ($arg_module != API) { return 404; }
        set $matomo_upstream http://matomo:80;
        proxy_pass $matomo_upstream/matomo/index.php$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /matomo/ {
        return 404;
    }

    # React app. There is no client-side router, so unknown paths are real 404s
    # instead of a 200 serving the SPA shell.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Cache fingerprinted static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
