<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seite nicht gefunden — EL0M AI ENGINEER</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#020817" />
    <style>
        :root { --bg:#020817; --text:#e2e8f0; --muted:#94a3b8; --line:rgba(148,163,184,.16); --violet:#8b5cf6; --cyan:#06b6d4; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 30%, rgba(139,92,246,.12), transparent 60%), var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; padding:24px; }
        .card { max-width:520px; text-align:center; }
        .code { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:64px; font-weight:700; letter-spacing:.06em; background:linear-gradient(120deg,#c4b5fd,#67e8f9); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        h1 { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:22px; margin:8px 0 10px; }
        p { color:var(--muted); margin:0 0 22px; }
        a.btn { display:inline-flex; padding:10px 18px; border-radius:9px; text-decoration:none; color:#67e8f9; border:1px solid rgba(6,182,212,.35); background:rgba(6,182,212,.08); font-size:14px; font-weight:600; }
        a.btn + a.btn { margin-left:8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>Seite nicht gefunden / Page not found</h1>
        <p>Diese Adresse existiert nicht (mehr). Möglicherweise wurde ein Artikel offline genommen.<br />
            This address does not exist — an article may have been unpublished.</p>
        <a class="btn" href="/">Startseite</a>
        <a class="btn" href="/blog/">Blog</a>
    </div>
</body>
</html>
