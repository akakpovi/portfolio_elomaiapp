# Serve Matomo under /matomo/ while keeping its DocumentRoot at /var/www/html.
# Matomo derives every generated URL from SCRIPT_NAME, so the application
# works unmodified at https://elomaiapp.com/matomo/.
Alias /matomo /var/www/html

<Directory /var/www/html>
    Options +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Never advertise the PHP version.
ServerTokens Prod
ServerSignature Off
